<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Jiajun Zhu's personal directory of pages and short links.">
  <link rel="canonical" href="https://zhuconv.github.io/portal/">
  <link rel="icon" type="image/png" href="/images/favicon/utaustin.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;0,700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (() => {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem('homepage-theme');
      } catch (_) {}
      document.documentElement.dataset.theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/stylesheet.css?v=20260726-5">
  <link rel="stylesheet" href="./portal.css?v=20260913-2">
  <title>Personal portal · Jiajun Zhu</title>
</head>
<body class="portal-page">
  <div class="portal-shell">
    <header class="portal-header">
      <a class="portal-owner" href="/">Jiajun Zhu<span class="portal-breadcrumb"> / portal</span></a>
      <button class="theme-toggle" id="theme-toggle" type="button" hidden
              aria-label="Switch to dark mode" title="Switch to dark mode">
        <i aria-hidden="true">
          <svg class="theme-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
          <svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </i>
      </button>
    </header>

    <main>
      <div class="portal-intro">
        <p class="portal-eyebrow">ZHUCONV.GITHUB.IO</p>
        <h1>Personal portal<span>.</span></h1>
        <p class="portal-description">Pages, meetings, and booking links in one place.</p>
      </div>

      <section class="portal-section" aria-labelledby="redirects-heading">
        <div class="portal-section-heading">
          <h2 id="redirects-heading">Redirects</h2>
          <span>Short links to share</span>
        </div>
        <ul class="portal-links">
          <!-- portal:redirects:start -->
          <!-- portal:redirects:end -->
        </ul>
      </section>

      <section class="portal-section portal-site" aria-labelledby="pages-heading">
        <div class="portal-section-heading">
          <h2 id="pages-heading">On this site</h2>
        </div>
        <ul class="portal-pages">
          <!-- portal:pages:start -->
          <!-- portal:pages:end -->
        </ul>
      </section>

      <div class="portal-copy-feedback">
        <p id="copy-status" role="status" aria-live="polite"></p>
        <input id="copy-fallback" type="text" readonly hidden aria-label="Select and copy this link">
      </div>
    </main>

    <footer class="portal-footer">
      <span>Jiajun Zhu</span>
      <span class="portal-footer-path">/portal</span>
    </footer>
  </div>
  <script src="/main.js?v=20260726-1"></script>
  <script src="./portal.js"></script>
</body>
</html>
